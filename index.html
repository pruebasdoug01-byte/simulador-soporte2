<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Soporte Técnico Escolar 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; }
        .welcome-box { border-left: 5px solid #1a73e8; padding: 15px; background: #e8f0fe; margin-bottom: 20px; }
        .case-card { display: none; }
        .case-card.active { display: block; animation: fadeIn 0.5s; }
        .question { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; display: block; }
        .case-image { width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; background: #fafafa; }
        .option { display: block; background: #f8f9fa; border: 2px solid #dee2e6; padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .option:hover { background: #e9ecef; border-color: #1a73e8; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn { display: inline-block; background: #1a73e8; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 10px; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #1a73e8; width: 0%; border-radius: 5px; transition: 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador de Soporte Técnico 2026</h1>
    
    <div id="intro">
        <div class="welcome-box">
            <strong>¡Bienvenido, equipo!</strong><br>
            Este simulador interactivo incluye imágenes reales de los errores reportados en campo para mejorar su capacidad de diagnóstico.
        </div>
        <button class="btn" onclick="startSim()">Empezar Simulador</button>
    </div>

    <div id="game-area" style="display:none;">
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div id="case-container"></div>
    </div>

    <div id="results" style="display:none; text-align: center;">
        <h2>Resultado Final</h2>
        <p id="score-text"></p>
        <button class="btn" onclick="location.reload()">Reiniciar Entrenamiento</button>
    </div>
</div>

<script>
    const cases = [
        {
            section: "Tablets (2.º Grado)",
            q: "Caso: Tablet sin conectividad ni cuenta vinculada. ¿Cuál es el orden lógico?",
            options: [
                { text: "Crear una cuenta personal de Gmail y luego buscar Wi-Fi.", correct: false, info: "Incorrecto. Se deben priorizar las credenciales institucionales." },
                { text: "Conectar a una red Wi-Fi institucional estable y configurar la cuenta @clases.edu.sv.", correct: true, info: "¡Correcto! Primero la conectividad, luego la identidad digital." }
            ]
        },
        {
            section: "Laptops Windows",
            q: "Analiza la imagen: El estudiante usa un perfil local. ¿Cómo agrega su cuenta @clases correctamente?",
            image: "image_4a2a83.png",
            options: [
                { text: "Clic en el círculo del perfil (esquina superior derecha) > Sección 'Otros perfiles de Chrome' > Añadir nuevo perfil.", correct: true, info: "¡Correcto! Esta es la forma oficial de separar el entorno educativo del personal." },
                { text: "Abrir una Nueva ventana de incógnito para trabajar temporalmente.", correct: false, info: "Incorrecto. El incógnito no guarda la sincronización de Classroom o Drive." }
            ]
        },
        {
            section: "Laptops Windows",
            q: "Portal aprendes.edu.gob.sv: Aparece 'El usuario no existe'. ¿Cuál es el procedimiento?",
            options: [
                { text: "Validar con el docente si el estudiante figura en la lista oficial de la plataforma.", correct: true, info: "¡Correcto! Si no aparece en lista, el problema es administrativo (inscripción)." },
                { text: "Restablecer de fábrica el equipo inmediatamente.", correct: false, info: "No. El error es de la plataforma, no del hardware." }
            ]
        },
        {
            section: "Chromebooks",
            q: "Observa el error en pantalla: ¿Cuál es la acción correctiva inmediata para este caso?",
            image: "Cryphome.jpeg",
            options: [
                { text: "Eliminar el usuario afectado desde la pantalla de inicio y volver a agregar la cuenta @clases.", correct: true, info: "¡Excelente! Eliminar el perfil corrupto localmente suele solucionar el error de Cryptohome." },
                { text: "Realizar un cambio físico de la pantalla del equipo.", correct: false, info: "No. Es un error de encriptación del perfil de usuario, no de hardware." }
            ]
        }
        // He resumido los casos para que pruebes las imágenes. Puedes agregar los demás siguiendo este formato.
    ];

    let currentCase = 0;
    let score = 0;

    function startSim() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        showCase();
    }

    function showCase() {
        const c = cases[currentCase];
        const container = document.getElementById('case-container');
        document.getElementById('progress').style.width = `${(currentCase / cases.length) * 100}%`;

        let imgHtml = c.image ? `<img src="${c.image}" class="case-image" alt="Referencia de error">` : '';

        container.innerHTML = `
            <div class="case-card active">
                <small style="color: #666; text-transform: uppercase;">Sección: ${c.section}</small>
                <p class="question">${c.q}</p>
                ${imgHtml}
                <div id="options-area">
                    ${c.options.map((opt, i) => `
                        <div class="option" onclick="checkAnswer(${i})">${opt.text}</div>
                    `).join('')}
                </div>
                <div id="feedback-area" class="feedback"></div>
                <button id="next-btn" class="btn" style="display:none;" onclick="nextStep()">Siguiente Caso</button>
            </div>
        `;
    }

    function checkAnswer(idx) {
        const opt = cases[currentCase].options[idx];
        const fb = document.getElementById('feedback-area');
        const options = document.querySelectorAll('.option');
        options.forEach(o => o.style.pointerEvents = 'none');
        fb.style.display = 'block';
        fb.className = 'feedback ' + (opt.correct ? 'correct' : 'incorrect');
        fb.innerHTML = opt.info;
        if(opt.correct) score++;
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextStep() {
        currentCase++;
        if(currentCase < cases.length) {
            showCase();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        const finalScore = Math.round((score / cases.length) * 100);
        document.getElementById('score-text').innerHTML = `<strong>Puntuación: ${finalScore}%</strong><br>Entrenamiento completado.`;
    }
</script>

</body>
</html>

</body>
</html>
