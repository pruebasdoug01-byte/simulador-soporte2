<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Soporte Técnico Escolar 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 10px; }
        .welcome-box { border-left: 5px solid #1a73e8; padding: 15px; background: #e8f0fe; margin-bottom: 20px; }
        .case-card { display: none; }
        .case-card.active { display: block; animation: fadeIn 0.5s; }
        .question { font-weight: bold; font-size: 1.15em; margin-bottom: 15px; display: block; color: #202124; }
        .case-image { width: 100%; max-height: 380px; object-fit: contain; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; background: #fafafa; }
        .option { display: block; background: #f8f9fa; border: 2px solid #dee2e6; padding: 14px; margin-bottom: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .option:hover { background: #e9ecef; border-color: #1a73e8; }
        .option.selected-correct { background: #d4edda; border-color: #28a745; }
        .option.selected-incorrect { background: #f8d7da; border-color: #dc3545; }
        .feedback { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-weight: 500; }
        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn { display: inline-block; background: #1a73e8; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #1557b0; }
        .progress-container { margin-bottom: 25px; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: #1a73e8; width: 0%; transition: 0.4s; }
        .stats { font-size: 0.9em; color: #666; margin-bottom: 5px; text-align: right; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulador de Soporte Técnico 2026</h1>
    
    <div id="intro">
        <div class="welcome-box">
            <strong>Evaluación de Competencias Técnicas</strong><br>
            Analice los casos reales de soporte utilizando las evidencias visuales. Todas las imágenes deben estar en formato .png para su correcta visualización.
        </div>
        <button class="btn" onclick="startSim()">Comenzar Evaluación</button>
    </div>

    <div id="game-area" style="display:none;">
        <div class="progress-container">
            <div class="stats" id="stats-text">Caso 1 de 9</div>
            <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        </div>
        <div id="case-container"></div>
    </div>

    <div id="results" style="display:none; text-align: center;">
        <h2>Resultado del Entrenamiento</h2>
        <div id="final-score-circle" style="font-size: 3em; font-weight: bold; color: #1a73e8; margin: 20px 0;">0%</div>
        <p id="score-text"></p>
        <button class="btn" onclick="location.reload()">Reiniciar Simulador</button>
    </div>
</div>

<script>
    const cases = [
        {
            section: "Tablets (2.º Grado)",
            q: "1. Caso: Tablet sin conectividad ni cuenta vinculada. ¿Cuál es el orden lógico de los pasos a seguir?",
            image: "Q01Tablet.png",
            options: [
                { text: "Crear una cuenta personal de Gmail y luego buscar Wi-Fi.", correct: false, info: "Incorrecto. Priorice siempre las credenciales institucionales." },
                { text: "Conectar a una red Wi-Fi institucional estable y proceder a configurar la cuenta @clases.edu.sv.", correct: true, info: "¡Correcto! Primero garantizamos la red para luego gestionar la identidad digital." }
            ]
        },
        {
            section: "Tablets (2.º Grado)",
            q: "2. Caso: Tablet con cuenta Gmail pero sin internet. ¿Qué verificación es prioritaria?",
            image: "Q02Tablet.png",
            options: [
                { text: "Verificar restricciones de red, conectar a la Wi-Fi institucional y validar la cuenta @clases.", correct: true, info: "¡Correcto! Es vital asegurar que el perfil navegue bajo la cuenta educativa oficial." },
                { text: "Solicitar datos móviles al docente.", correct: false, info: "Incorrecto. Se debe utilizar la infraestructura del proyecto escolar." }
            ]
        },
        {
            section: "Tablets (2.º Grado)",
            q: "3. Caso: Restricción por Control Parental (Family Link). ¿Cómo procede?",
            image: "Q03Tablet.png",
            options: [
                { text: "Desvincular cuenta personal, restablecer de fábrica o solicitar autorización vía docente.", correct: true, info: "¡Correcto! Esto permite limpiar el equipo para el uso pedagógico oficial." },
                { text: "Solicitar el PIN personal de los padres.", correct: false, info: "Incorrecto. No debemos gestionar claves personales de terceros." }
            ]
        },
        {
            section: "Laptops Windows",
            q: "4. Configuración de Identidad: El estudiante usa perfil local. ¿Cómo integra la cuenta @clases en Chrome?",
            image: "image_4a2a83.png",
            options: [
                { text: "Clic en el círculo del perfil (derecha) > Otros perfiles > Añadir nuevo perfil.", correct: true, info: "¡Correcto! Es la forma técnica de separar el entorno personal del educativo." },
                { text: "Abrir una ventana de incógnito.", correct: false, info: "Incorrecto. El incógnito no permite la sincronización de datos." }
            ]
        },
        {
            section: "Laptops Windows",
            q: "5. Plataformas: Aparece el mensaje '¡Error de inicio de sesión!' en el portal. ¿Qué debe hacer?",
            image: "Q05Laptop.png",
            options: [
                { text: "Validar con el docente si el estudiante figura en la lista oficial de la plataforma.", correct: true, info: "¡Correcto! Descartamos errores de inscripción antes de escalar a nivel técnico." },
                { text: "Restablecer de fábrica el equipo.", correct: false, info: "Incorrecto. El fallo reside en la validación del usuario en plataforma." }
            ]
        },
        {
            section: "Laptops Windows",
            q: "6. Conectividad: La laptop muestra 'Sin acceso a internet' en la red institucional. ¿Paso esencial?",
            image: "Q06Laptop.png",
            options: [
                { text: "Clic derecho > 'Dejar de recordar' y reingresar credenciales (Aprender!_sv).", correct: true, info: "¡Correcto! Refresca la autenticación con los certificados de la red." },
                { text: "Formatear el equipo.", correct: false, info: "Incorrecto. Es una medida excesiva para un error de autenticación." }
            ]
        },
        {
            section: "Chromebooks",
            q: "7. Inicio de Sesión: Problemas de acceso con datos incorrectos. ¿Cuál es el paso preventivo?",
            image: "Q07Laptop.png",
            options: [
                { text: "Cambiar contraseña en consola, usar 'Recuperar usuario' y elegir 'Continuar de todos modos'.", correct: true, info: "¡Correcto! Este flujo actualiza la llave de seguridad local." },
                { text: "Esperar 24 horas a que se desbloquee.", correct: false, info: "Incorrecto. El técnico debe intervenir mediante la consola." }
            ]
        },
        {
            section: "Chromebooks",
            q: "8. Caso: Sesión iniciada sin cuenta en el navegador. El estudiante logra ingresar a la interfaz de la Chromebook, pero al abrir Chrome, nota que su cuenta @clases no está sincronizada. ¿Cuál es la solución?",
            image: "",
            options: [
                { text: "Se debe configurar nuevamente la cuenta @clases realizando el ingreso completo desde la pantalla de inicio. El error ocurre por omitir la validación de credenciales inicial.", correct: true, info: "¡Correcto! Sin contraseña al arranque, el navegador no sincroniza el perfil automáticamente." },
                { text: "Sugerir el uso de una cuenta @gmail personal en el navegador.", correct: false, info: "Incorrecto. Siempre se debe priorizar la cuenta institucional @clases." }
            ]
        },
        {
            section: "Chromebooks",
            q: "9. Error Crítico: ¿Cuál es la acción inmediata ante el mensaje de Cryptohome corrupto?",
            image: "Cryphome.png",
            options: [
                { text: "Eliminar el usuario afectado desde la pantalla de inicio y volver a agregarlo.", correct: true, info: "¡Excelente! Esta acción repara la carpeta de usuario dañada de forma rápida." },
                { text: "Cambiar la pantalla física del equipo.", correct: false, info: "Incorrecto. Es un error lógico del perfil de usuario." }
            ]
        }
    ];

    let currentCase = 0;
    let score = 0;

    function startSim() {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        showCase();
    }

    function showCase() {
        const c = cases[currentCase];
        const container = document.getElementById('case-container');
        document.getElementById('progress').style.width = `${(currentCase / cases.length) * 100}%`;
        document.getElementById('stats-text').innerText = `Caso ${currentCase + 1} de ${cases.length}`;

        let imgHtml = c.image ? `<img src="${c.image}" class="case-image" alt="Referencia visual">` : '';

        container.innerHTML = `
            <div class="case-card active">
                <small style="color: #1a73e8; font-weight: bold; text-transform: uppercase;">${c.section}</small>
                <p class="question">${c.q}</p>
                ${imgHtml}
                <div id="options-area">
                    ${c.options.map((opt, i) => `
                        <div class="option" id="opt-${i}" onclick="checkAnswer(${i})">${opt.text}</div>
                    `).join('')}
                </div>
                <div id="feedback-area" class="feedback"></div>
                <div style="text-align: right;">
                    <button id="next-btn" class="btn" style="display:none;" onclick="nextStep()">
                        ${currentCase === cases.length - 1 ? 'Finalizar' : 'Siguiente'}
                    </button>
                </div>
            </div>
        `;
    }

    function checkAnswer(idx) {
        const opt = cases[currentCase].options[idx];
        const fb = document.getElementById('feedback-area');
        const options = document.querySelectorAll('.option');
        options.forEach((o, i) => {
            o.style.pointerEvents = 'none';
            if (cases[currentCase].options[i].correct) o.classList.add('selected-correct');
            else if (i === idx) o.classList.add('selected-incorrect');
        });
        fb.style.display = 'block';
        fb.className = 'feedback ' + (opt.correct ? 'correct' : 'incorrect');
        fb.innerHTML = opt.info;
        if(opt.correct) score++;
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextStep() {
        currentCase++;
        if(currentCase < cases.length) showCase();
        else showResults();
    }

    function showResults() {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        const finalScore = Math.round((score / cases.length) * 100);
        document.getElementById('final-score-circle').innerText = `${finalScore}%`;
        let msg = finalScore >= 80 ? "¡Excelente! Dominas los protocolos técnicos de la sede." : "Se recomienda revisar los manuales de procedimientos técnicos.";
        document.getElementById('score-text').innerHTML = `<strong>${score} de ${cases.length} correctas.</strong><br>${msg}`;
    }
</script>

</body>
</html>
